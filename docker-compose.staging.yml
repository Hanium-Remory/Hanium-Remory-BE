# 도메인·IAM 역할이 준비되기 전, API 만 먼저 띄워 DB 연결과 기동을 확인할 때 쓴다.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.prod up -d --build
#
# 임시 구성이라는 점에 주의:
#   - HTTPS 가 없어서 패스키(WebAuthn)는 동작하지 않는다. 도메인이 생기면
#     docker-compose.prod.yml (Caddy + 자동 HTTPS) 로 넘어가고 이 파일은 지운다.
#   - 업로드는 컨테이너 로컬 디스크에 쌓인다(S3 권한이 아직 없으므로).
#     인스턴스 역할이 붙으면 STORAGE_BACKEND 를 s3 로 바꾼다.
#   - 토큰이 평문으로 오가므로 8080 은 본인 IP 로만 열어둘 것.
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?RDS 접속 문자열이 필요합니다}
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?운영 비밀키를 설정해야 합니다}

      # HTTPS 가 없어 패스키는 어차피 안 되지만, 설정값은 있어야 기동한다.
      RP_ID: ${RP_ID:-localhost}
      RP_NAME: ReMory
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-["http://localhost"]}

      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}

      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:

# main 으로의 push 와 모든 PR 에서 테스트를 돌린다.
# 배포(CD)는 별도 워크플로에서 처리한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 컨테이너와 같은 3.11 로 맞춘다. 다르면 여기서만 통과하는 일이 생긴다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 테스트
        # 테스트는 SQLite 를 쓰므로 RDS 접속 정보가 필요 없다.
        # 다만 config 가 기동 시 값을 요구하므로 더미를 넣어준다.
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET: ci-dummy-secret-not-used-in-production
        run: pytest -q

# EC2 운영용 구성. Caddy 가 HTTPS 를 붙이고 뒤로 API 를 프록시한다.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# DB 는 RDS 를 쓰는 것을 권장한다(백업·장애복구 때문에).
# EC2 안에서 Postgres 컨테이너로 돌리려면 아래 db 서비스의 주석을 풀고
# DATABASE_URL 을 db 호스트로 바꾼다.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 설정해야 합니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 발급받은 인증서. 지우면 재발급된다(rate limit 주의)
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    # Caddy 를 거쳐서만 들어오게 하고 호스트 포트는 열지 않는다.
    expose:
      - "8000"
    # 아래 environment 목록에 없는 설정도 앱에 전달되게 파일째 넘긴다.
    # 이게 없으면 .env.prod 에 적어도 조용히 무시된다(OTP_TTL_SEC,
    # INVITE_CODE_TTL_DAYS, 알림 쿨다운 값 등). 겹치는 키는 environment 가 이긴다.
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?RDS 접속 문자열이 필요합니다}
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?운영 비밀키를 설정해야 합니다}

      # 패스키. RP_ID 는 반드시 실제 도메인과 같아야 한다.
      RP_ID: ${DOMAIN}
      RP_NAME: ReMory
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?["https://도메인", "android:apk-key-hash:..."] 형식}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-[]}
      IOS_APP_IDS: ${IOS_APP_IDS:-[]}

      # 업로드 저장소: s3 | local
      # s3 는 EC2 인스턴스 역할에 S3 권한을 붙이면 키가 필요 없고,
      # 버킷은 비공개로 두고 조회 응답에만 presigned URL 을 내려준다.
      # local 은 아래 uploads 볼륨(EC2 의 EBS)에 쌓는다. S3 권한을 못 받았을 때
      # 쓰는 대안이며, 인스턴스를 종료하면 파일이 사라진다.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      # local 모드에서는 비어 있어도 된다. s3 모드에서 비면 기동 시 이유를 알려주고 멈춘다.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PRESIGN: ${S3_PRESIGN:-true}
      S3_PRESIGN_TTL_SEC: ${S3_PRESIGN_TTL_SEC:-3600}

      # 리포트 문구 생성. 비우면 규칙 기반 문구로 물러난다.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}

      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_SENDER_NUMBER: ${SMS_SENDER_NUMBER:-}
      ALIGO_API_KEY: ${ALIGO_API_KEY:-}
      ALIGO_USER_ID: ${ALIGO_USER_ID:-}
    # STORAGE_BACKEND=local 일 때 업로드 파일이 여기 쌓인다.
    # s3 모드에서는 쓰이지 않으므로 그냥 비어 있는다.
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # RDS 대신 EC2 안에서 DB 를 돌릴 때만 사용한다.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: remory
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  #     POSTGRES_DB: remory
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U remory"]
  #     interval: 5s
  #     retries: 10

volumes:
  caddy_data:
  caddy_config:
  uploads:
  # pgdata:

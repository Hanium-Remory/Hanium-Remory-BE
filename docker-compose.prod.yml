  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U remory"]
  #     interval: 5s
  #     retries: 10

volumes:
  caddy_data:
  caddy_config:
